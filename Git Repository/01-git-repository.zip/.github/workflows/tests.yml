name: Python backend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Functional Web Application/requirements.txt
      - run: python -m pip install -r "Functional Web Application/requirements.txt"
      - run: python scripts/run_tests.py
